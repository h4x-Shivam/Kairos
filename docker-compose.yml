version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: kairos_timescaledb
    environment:
      POSTGRES_USER: kairos_user
      POSTGRES_PASSWORD: kairos_password
      POSTGRES_DB: kairos_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kairos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
